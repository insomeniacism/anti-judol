[project]
name = "anti-judol-hunter"
version = "0.1.0"
description = "Autonomous OSINT harvester, async verifier, AI classifier, and solo submitter CLI for illegal Indonesian websites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "openai>=1.51.0",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "pyperclip>=1.9.0",
    "rich>=13.9.2",
    "typer>=0.12.5",
    "websockets>=13.1",
]

[project.scripts]
anti-judol = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
